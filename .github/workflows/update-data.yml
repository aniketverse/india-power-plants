name: Refresh India power station inventory

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: power-station-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check official CEA / NPP reports and reconcile stations
        run: python scripts/update_data.py

      - name: Publish changed inventory and update log
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cea_additions.csv data/update_log.json
            git commit -m "Automated CEA power station data refresh"
            git push
          else
            echo "No changes detected."
          fi
